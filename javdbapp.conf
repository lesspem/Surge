# NAME: JavDB App 去广告 & 去公告
# AUTHOR: lesspem
# REPO: https://github.com/lesspem/Surge
# UPDATED: 2026-08-10
# DESC: Quantumult X 重写规则，去除 JavDB App 广告和公告弹窗
#
# 使用方法：Quantumult X -> 重写 -> 引用，粘贴本文件 raw 链接：
# https://raw.githubusercontent.com/lesspem/Surge/main/javdbapp.conf

[rewrite_local]
# 开屏广告 + 公告弹窗：脚本处理 startup 接口（匹配所有备用域名）
^https:\/\/.+\/api\/v1\/startup url script-response-body https://raw.githubusercontent.com/lesspem/Surge/main/javdbapp.js

# 首页顶部 / 磁链页广告：脚本处理 ads 接口
^https:\/\/.+\/api\/v1\/ads url script-response-body https://raw.githubusercontent.com/lesspem/Surge/main/javdbapp.js

# 第三方广告/追踪 SDK（LiquidLink）上报：拦截
^https:\/\/api\.liquidlink\.cn\/api\/ url reject-dict

# 广告图片：拦截
^https:\/\/tp\.spfcas\.com\/[^\/]+\/ads\/ url reject-img

[mitm]
hostname = apidd.spthgb.com, apidd.czssdgz.com, apidd.btyjscl.com, api.ffaoa.com, api.aliycloud.com, api.liquidlink.cn, tp.spfcas.com
